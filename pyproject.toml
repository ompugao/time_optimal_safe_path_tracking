[project]
name = "tospt"
version = "0.1.0"
description = "Reproduction of Time-Optimal Path Tracking with ISO Safety Guarantees (arXiv 2306.05197)"
readme = "README.md"
authors = [
    { name = "Shohei Fujii", email = "fujii.shohei@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mujoco>=4.0.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "toppra>=0.6.11",
    "torch>=2.7",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
